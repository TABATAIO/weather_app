<!-- Favicon SVG - Simplified version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <circle cx="16" cy="16" r="15" fill="#4f46e5"/>
  
  <!-- Mascot Face -->
  <circle cx="16" cy="14" r="8" fill="#fbbf24"/>
  
  <!-- Eyes -->
  <circle cx="13" cy="12" r="1.5" fill="#1f2937"/>
  <circle cx="19" cy="12" r="1.5" fill="#1f2937"/>
  
  <!-- Nose -->
  <circle cx="16" cy="14.5" r="0.8" fill="#f59e0b"/>
  
  <!-- Mouth -->
  <path d="M 13 16 Q 16 18 19 16" stroke="#1f2937" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- Ears -->
  <ellipse cx="10" cy="8" rx="2" ry="3" fill="#fbbf24"/>
  <ellipse cx="22" cy="8" rx="2" ry="3" fill="#fbbf24"/>
  
  <!-- Weather icon -->
  <circle cx="16" cy="26" r="2" fill="#fbbf24"/>
</svg>